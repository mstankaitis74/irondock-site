<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irondock</title>
<meta name="description" content="Irondock – small, simple apps.">
<style>
  :root { --bg: #0f1f45; --text: #ffffff; --muted: #c9d4f0; --accent: #ff8a7a; --card: rgba(255,255,255,0.06); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(150deg, #1d3a72 0%, #0f1f45 55%, #081330 100%); color: var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 72px 20px; }
  h1 { font-size: 48px; margin: 0 0 8px; letter-spacing: -0.5px; }
  .lead { color: var(--muted); font-size: 20px; margin: 0 0 48px; }
  .app { background: var(--card); border-radius: 24px; padding: 24px; }
  .app h2 { margin: 0 0 6px; font-size: 24px; }
  .app p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
  a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Irondock</h1>
  <p class="lead">Small, simple apps that respect your time and your data.</p>

  <section class="app">
    <h2>Beatsy</h2>
    <p>Check your heart rate with your phone camera. Ads never interrupt a measurement, and your data stays on your phone.</p>
    <a href="/beatsy/privacy/">Privacy policy</a>
  </section>

  <footer>Contact: <a href="mailto:info@irondock.dev">info@irondock.dev</a></footer>
</main>
</body>
</html>
